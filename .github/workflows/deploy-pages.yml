name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "feat/ui-redesign"]
  workflow_dispatch: # Allows you to run this manually from the Actions tab

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
# `actions: write` is needed only for the stale-artifact cleanup step below (deleting a leftover
# "github-pages" artifact via the API) — not for the deploy itself.
permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive # Important: we have submodules for webstlink, gnwmanager, etc.
          # Both refs are built from this one clone, so we need more than the triggering commit.
          fetch-depth: 0
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run push gate and build Web App (production, from main)
        run: |
          ./scripts/push-gate.sh
          rm -rf /tmp/site && mkdir -p /tmp/site
          cp -r apps/web/dist/. /tmp/site/
        env:
          # Set the base path for GitHub Pages based on the repository name
          PUBLIC_BASE: /gnw-retro-go-web-builder/
          # Production owns the storage names it has always owned. Do not set a scope here.
          PUBLIC_STORAGE_SCOPE: ""

      - name: Assemble site
        run: |
          set -euo pipefail
          echo "Site: current build at /"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      # Guards against "Multiple artifacts named github-pages were unexpectedly found for this
      # workflow run" from actions/deploy-pages@v4. That error happens when this run has been
      # re-run (GitHub's "Re-run jobs") — the previous attempt's "github-pages" artifact is still
      # attached to this run ID, so the new upload below creates a second one with the same name.
      # Delete any leftover one first so there's always at most one by the time we deploy.
      - name: Clean up stale github-pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            --jq '.artifacts[] | select(.name=="github-pages") | .id' |
          while read -r id; do
            echo "Deleting stale github-pages artifact $id"
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id"
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # The assembled site: the current production build at the root.
          path: '/tmp/site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
