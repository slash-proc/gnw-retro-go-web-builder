name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch: # Allows you to run this manually from the Actions tab

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
# `actions: write` is needed only for the stale-artifact cleanup step below (deleting a leftover
# "github-pages" artifact via the API) — not for the deploy itself.
permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive # Important: we have submodules for webstlink, gnwmanager, etc.

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build internal packages
        run: node packages/gnw-restool/scripts/buildZip.mjs && npx tsc -b packages/builder-core packages/fs-builders packages/gnw-flasher packages/gnw-patch packages/swd-transport packages/thumb-asm packages/gnw-restool

      - name: Build Web App
        run: npm run build --workspace @gnw/web
        env:
          # Set the base path for GitHub Pages based on the repository name
          PUBLIC_BASE: /gnw-retro-go-web-builder/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      # Guards against "Multiple artifacts named github-pages were unexpectedly found for this
      # workflow run" from actions/deploy-pages@v4. That error happens when this run has been
      # re-run (GitHub's "Re-run jobs") — the previous attempt's "github-pages" artifact is still
      # attached to this run ID, so the new upload below creates a second one with the same name.
      # Delete any leftover one first so there's always at most one by the time we deploy.
      - name: Clean up stale github-pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            --jq '.artifacts[] | select(.name=="github-pages") | .id' |
          while read -r id; do
            echo "Deleting stale github-pages artifact $id"
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id"
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload the dist folder generated by Vite
          path: './apps/web/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
