name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "feat/ui-redesign"]
  workflow_dispatch: # Allows you to run this manually from the Actions tab
    inputs:
      wip_branch:
        description: "Branch to publish under /wip/ (blank = the default below)"
        required: false
        default: ""

# The branch published at /wip/ for testers. Production ALWAYS comes from `main`, whatever ref
# triggered this run, so pushing the wip branch can never change what production serves.
env:
  WIP_BRANCH_DEFAULT: "feat/ui-redesign"

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
# `actions: write` is needed only for the stale-artifact cleanup step below (deleting a leftover
# "github-pages" artifact via the API) — not for the deploy itself.
permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive # Important: we have submodules for webstlink, gnwmanager, etc.
          # Both refs are built from this one clone, so we need more than the triggering commit.
          fetch-depth: 0
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build internal packages
        run: node packages/gnw-restool/scripts/buildZip.mjs && npx tsc -b packages/builder-core packages/fs-builders packages/gnw-flasher packages/gnw-patch packages/swd-transport packages/thumb-asm packages/gnw-restool

      - name: Build Web App (production, from main)
        run: |
          npm run build --workspace @gnw/web
          rm -rf /tmp/site && mkdir -p /tmp/site
          cp -r apps/web/dist/. /tmp/site/
        env:
          # Set the base path for GitHub Pages based on the repository name
          PUBLIC_BASE: /gnw-retro-go-web-builder/
          # Production owns the storage names it has always owned. Do not set a scope here.
          PUBLIC_STORAGE_SCOPE: ""

      # Everything below through "Assemble" is the /wip/ build. It is fenced with
      # continue-on-error so a broken wip branch degrades to "the last good /wip/ is replaced by
      # nothing" rather than taking production down with it. Production is already staged in
      # /tmp/site by the step above and is never rebuilt from the wip tree.
      - name: Build Web App (/wip/)
        id: wip
        continue-on-error: true
        run: |
          set -euo pipefail
          BRANCH="${{ github.event.inputs.wip_branch }}"
          [ -n "$BRANCH" ] || BRANCH="${WIP_BRANCH_DEFAULT}"
          echo "Publishing /wip/ from $BRANCH"
          git checkout --force "origin/$BRANCH"
          git submodule update --init --recursive
          npm ci
          node packages/gnw-restool/scripts/buildZip.mjs
          npx tsc -b packages/builder-core packages/fs-builders packages/gnw-flasher \
                   packages/gnw-patch packages/swd-transport packages/thumb-asm packages/gnw-restool
          npm run build --workspace @gnw/web
          # Only publish a wip build that completed; a partial dist must not reach the artifact.
          rm -rf /tmp/wip-dist && cp -r apps/web/dist /tmp/wip-dist
        env:
          PUBLIC_BASE: /gnw-retro-go-web-builder/wip/
          # Gives the wip build its own localStorage keys, IndexedDB databases and OPFS
          # directory, so testers cannot read or migrate production users' data.
          # `apps/web/test/storagescope.mjs` fails the build if this is ever removed.
          PUBLIC_STORAGE_SCOPE: wip

      - name: Assemble site
        run: |
          set -euo pipefail
          if [ -d /tmp/wip-dist ]; then
            cp -r /tmp/wip-dist /tmp/site/wip
            echo "Site: production at / and wip at /wip/"
          else
            echo "::warning::wip build failed or produced nothing; publishing production only"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      # Guards against "Multiple artifacts named github-pages were unexpectedly found for this
      # workflow run" from actions/deploy-pages@v4. That error happens when this run has been
      # re-run (GitHub's "Re-run jobs") — the previous attempt's "github-pages" artifact is still
      # attached to this run ID, so the new upload below creates a second one with the same name.
      # Delete any leftover one first so there's always at most one by the time we deploy.
      - name: Clean up stale github-pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            --jq '.artifacts[] | select(.name=="github-pages") | .id' |
          while read -r id; do
            echo "Deleting stale github-pages artifact $id"
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id"
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # The assembled site: production at the root, the wip build under /wip/.
          path: '/tmp/site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
