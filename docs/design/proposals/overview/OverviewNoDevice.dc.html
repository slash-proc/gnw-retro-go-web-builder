<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap">
  <style>
    body { margin: 0; }
    a { color: #3e9e4e; } a:hover { color: #2f7a3c; }
  </style>
</helmet>

<!-- PROPOSAL: Overview / Summary with NO DEVICE. Drawn because it is the first thing
     most people see, and because the four panes do not degrade the same way:
       Summary / Details  need a connected device -- nothing to report without one.
       Retro-Go log       needs a device AND retro-go running; the buffer lives in the
                          device's RAM (devicelog.ts:14). Rail item is dimmed.
       Audit log          works with no device at all -- it already holds this session's
                          source and converter activity. Rail item stays live, with its
                          count, because it is the one pane worth opening here.
     Copy reuses the approved overview.waitingForConnection string verbatim. -->
<div style="width: 1440px; min-height: 920px; background: #f4f4f4; color: #1b1b1b; font-family: 'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif; font-size: 16px; line-height: 1.5; display: flex; flex-direction: column;">

  <div style="display: flex; flex-direction: column;">
    <div style="height: 56px; background: #ffffff; display: flex; align-items: center; justify-content: space-between; padding: 0 40px;">
      <div style="display: flex; align-items: center; gap: 13px;">
        <svg width="19" height="19" viewBox="0 0 20 20" fill="none" stroke="#1b1b1b" stroke-width="1.3" stroke-linecap="round">
          <rect x="5" y="5" width="10" height="10" rx="1.2"></rect>
          <path d="M7.5 5V3M10 5V3M12.5 5V3M7.5 17v-2M10 17v-2M12.5 17v-2M5 7.5H3M5 10H3M5 12.5H3M17 7.5h-2M17 10h-2M17 12.5h-2"></path>
        </svg>
        <div style="display: flex; align-items: center; gap: 11px;">
          <span style="position: relative; display: inline-flex; flex-shrink: 0;">
            <span style="height: 28px; width: 47px; background: #c9c9cd; border: 1px solid rgba(0,0,0,0.35); border-radius: 2px; box-shadow: 0 1px 0 rgba(255,255,255,0.5) inset, 0 1px 2px rgba(0,0,0,0.25); display: flex; align-items: center; justify-content: center;">
              <img src="icon-console.svg" alt="" style="height: 100%; width: 100%; object-fit: contain; display: block;">
            </span>
          </span>
          <span style="font-size: 14px; font-weight: 600;">No device</span>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 18px;">
        <span style="font-size: 12px; font-weight: 500; color: #5c5c5c;">EN</span>
        <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="#5c5c5c" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 12.5A7 7 0 0 1 7.5 4a7 7 0 1 0 8.5 8.5z"></path>
        </svg>
      </div>
    </div>
    <div style="height: 3px; background: linear-gradient(180deg, #d9bc5e 0%, #c09a32 100%);"></div>
  </div>

  <div style="padding: 0 40px; background: #ffffff; border-bottom: 1px solid #d8d8d8; display: flex; align-items: stretch; gap: 34px;">
    <div style="display: flex; align-items: center; height: 46px; padding: 0 2px; font-size: 14px; font-weight: 700; letter-spacing: 0.02em; color: #1b1b1b; box-shadow: inset 0 -3px 0 #3e9e4e;">Overview</div>
    <div style="display: flex; align-items: center; height: 46px; padding: 0 2px; font-size: 14px; font-weight: 600; letter-spacing: 0.02em; color: #6e6e6e; box-shadow: inset 0 -3px 0 transparent;">Firmware</div>
    <div style="display: flex; align-items: center; height: 46px; padding: 0 2px; font-size: 14px; font-weight: 600; letter-spacing: 0.02em; color: #6e6e6e; box-shadow: inset 0 -3px 0 transparent;">Sources</div>
    <div style="display: flex; align-items: center; height: 46px; padding: 0 2px; font-size: 14px; font-weight: 600; letter-spacing: 0.02em; color: #6e6e6e; box-shadow: inset 0 -3px 0 transparent;">Library</div>
  </div>

  <div style="display: grid; grid-template-columns: 244px minmax(0, 1fr); gap: 0; flex-grow: 1;">
    <div style="border-right: 1px solid #d8d8d8; padding: 32px 20px 40px 40px; display: flex; flex-direction: column; gap: 26px;"><div style="display: flex; flex-direction: column; gap: 4px;"><div style="font-size: 11px; font-weight: 700; letter-spacing: 0.11em; color: #5c5c5c; text-transform: uppercase; padding-bottom: 6px;">Status</div><div style="font-size: 14px; font-weight: 600; padding: 7px 0 7px 14px; margin-left: -14px; box-shadow: inset 2px 0 0 #3e9e4e; display: flex; align-items: center; justify-content: space-between; gap: 10px;"><span>Summary</span></div><div style="font-size: 14px; padding: 7px 0; display: flex; align-items: center; justify-content: space-between; gap: 10px;"><span>Details</span></div></div><div style="display: flex; flex-direction: column; gap: 4px;"><div style="font-size: 11px; font-weight: 700; letter-spacing: 0.11em; color: #5c5c5c; text-transform: uppercase; padding-bottom: 6px;">Logs</div><div style="font-size: 14px; color: #9a9a9a; padding: 7px 0; display: flex; align-items: center; justify-content: space-between; gap: 10px;"><span>Retro-Go log</span></div><div style="font-size: 14px; padding: 7px 0; display: flex; align-items: center; justify-content: space-between; gap: 10px;"><span>Audit log</span><span style="font-size: 12px; color: #5c5c5c;">9</span></div></div></div>
    <div style="display: flex; flex-direction: column; justify-content: space-between;"><div style="padding: 32px 40px 40px; display: flex; flex-direction: column; gap: 32px; max-width: 720px;"><div style="display: flex; flex-direction: column; gap: 6px;"><div style="font-size: 24px; font-weight: 600; letter-spacing: -0.015em;">Summary</div></div><div style="background: #ffffff; border: 1px solid #d8d8d8; border-radius: 6px; padding: 44px 18px; display: flex; flex-direction: column; align-items: center; gap: 12px;"><svg width="26" height="26" viewBox="0 0 20 20" fill="none" stroke="#9a9a9a" stroke-width="1.3" stroke-linecap="round"><rect x="5" y="5" width="10" height="10" rx="1.2"></rect><path d="M7.5 5V3M10 5V3M12.5 5V3M7.5 17v-2M10 17v-2M12.5 17v-2M5 7.5H3M5 10H3M5 12.5H3M17 7.5h-2M17 10h-2M17 12.5h-2"></path></svg><span style="font-size: 14px; color: #5c5c5c;">Waiting for a device connection&hellip;</span></div></div><div style="border-top: 1px solid #d8d8d8; background: #ffffff; padding: 0 40px; min-height: 72px; box-sizing: border-box; margin-top: auto; display: flex; align-items: center; justify-content: space-between;"><span style="font-size: 13px; color: #5c5c5c;"></span><div style="display: flex; align-items: center; gap: 12px;"><div style="font-size: 13px; font-weight: 600; color: #1b1b1b; background: #ffffff; border: 1px solid #1b1b1b; border-radius: 5px; padding: 8px 18px;">Connect</div></div></div></div>
  </div>
</div>
</x-dc>
</body>
</html>
