<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>

<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap">
  <style>
    body { margin: 0; }
    a { color: #3e9e4e; } a:hover { color: #2f7a3c; }
  </style>
</helmet>

<!-- Threaded: the chooser redrawn in step 2's spine idiom, a hanging marker column and a connector thread on the page background, no card. -->
<div style="width: 1440px; height: 920px; overflow: hidden; background: #f4f4f4; color: #1b1b1b; font-family: 'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif; font-size: 16px; line-height: 1.5; display: flex; flex-direction: column;">
  <div style="display: flex; flex-direction: column;">
    <div style="height: 56px; background: #ffffff; display: flex; align-items: center; justify-content: space-between; padding: 0 40px;">
      <div style="display: flex; align-items: center; gap: 13px;">
        <svg width="19" height="19" viewBox="0 0 20 20" fill="none" stroke="#1b1b1b" stroke-width="1.3" stroke-linecap="round">
          <rect x="5" y="5" width="10" height="10" rx="1.2"></rect>
          <path d="M7.5 5V3M10 5V3M12.5 5V3M7.5 17v-2M10 17v-2M12.5 17v-2M5 7.5H3M5 10H3M5 12.5H3M17 7.5h-2M17 10h-2M17 12.5h-2"></path>
        </svg>
        <div style="display: flex; align-items: center; gap: 11px;">
          <span style="position: relative; display: inline-flex; flex-shrink: 0;">
            <span style="height: 28px; width: 47px; background: #2e9e44; border: 1px solid rgba(0,0,0,0.35); border-radius: 2px; box-shadow: 0 1px 0 rgba(255,255,255,0.5) inset, 0 1px 2px rgba(0,0,0,0.25); display: flex; align-items: center; justify-content: center;">
              <img src="icon-console.svg" alt="" style="height: 100%; width: 100%; object-fit: contain; display: block;">
            </span>
            <span style="position: absolute; right: -4px; bottom: -4px; background: #c9c9cd; border: 1px solid rgba(0,0,0,0.35); border-radius: 999px; padding: 2px; display: flex; box-shadow: 0 1px 2px rgba(0,0,0,0.2);">
              <svg viewBox="0 0 10 6" width="10" height="6"><path d="M0 0 L5 6 L10 0 Z" fill="#161616"></path></svg>
            </span>
          </span>
          <span style="font-size: 14px; font-weight: 600;">Connected (Recovery Mode)</span>
        </div>

        <span style="width: 1px; height: 18px; background: #d8d8d8; margin: 0 3px;"></span>

        <div style="display: flex; align-items: center; gap: 8px;">
          <img src="logo-gnw-badge.svg" alt="Game &amp; Watch" style="height: 27px; width: auto; display: block; flex-shrink: 0;">
          <span style="font-size: 14px; font-weight: 600;">Zelda (Patched)</span>
        </div>

        <span style="width: 1px; height: 18px; background: #d8d8d8; margin: 0 3px;"></span>

        <div style="display: flex; align-items: center; gap: 8px; opacity: 0.42;">
          <img src="logo-rgo.png" alt="Retro-Go" style="height: 14px; width: auto; display: block; flex-shrink: 0;">
          <span style="font-size: 14px; font-weight: 600;">Not installed</span>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 18px;">
        <span style="font-size: 12px; font-weight: 500; color: #5c5c5c;">EN</span>
        <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="#5c5c5c" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 12.5A7 7 0 0 1 7.5 4a7 7 0 1 0 8.5 8.5z"></path>
        </svg>
      </div>
    </div>
    <div style="height: 3px; background: linear-gradient(180deg, #d9bc5e 0%, #c09a32 100%);"></div>
  </div>

  <div style="padding: 0 40px; background: #ffffff; border-bottom: 1px solid #d8d8d8; display: flex; align-items: stretch; justify-content: space-between;">
    <div style="display: flex; align-items: stretch; gap: 34px;">
      <div style="display: flex; align-items: center; height: 46px; padding: 0 2px; font-size: 14px; font-weight: 600; letter-spacing: 0.02em; color: #6e6e6e; box-shadow: inset 0 -3px 0 transparent;">Overview</div>
      <div style="display: flex; align-items: center; height: 46px; padding: 0 2px; font-size: 14px; font-weight: 700; letter-spacing: 0.02em; color: #1b1b1b; box-shadow: inset 0 -3px 0 #3e9e4e;">Firmware</div>
      <div style="display: flex; align-items: center; height: 46px; padding: 0 2px; font-size: 14px; font-weight: 600; letter-spacing: 0.02em; color: #6e6e6e; box-shadow: inset 0 -3px 0 transparent;">Sources</div>
      <div style="display: flex; align-items: center; height: 46px; padding: 0 2px; font-size: 14px; font-weight: 600; letter-spacing: 0.02em; color: #6e6e6e; box-shadow: inset 0 -3px 0 transparent;">Library</div>
    </div>
    <div style="display: flex; align-items: center; gap: 18px;">
      <span style="font-size: 13px; font-weight: 600; box-shadow: inset 0 -2px 0 #3e9e4e; padding: 4px 0;">Guided</span>
      <span style="font-size: 13px; font-weight: 500; color: #5c5c5c;">Advanced</span>
    </div>
  </div>
  <div style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 0 40px;"><div style="width: 470px;"><div style="display: flex; align-items: center; gap: 6px;"><span style="width: 22px; height: 6px; border-radius: 3px; background: #3e9e4e;"></span><span style="width: 6px; height: 6px; border-radius: 3px; background: #d8d8d8;"></span></div><div style="height: 12px;"></div><div style="font-size: 28px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.15;">What should this device run?</div><div style="height: 8px;"></div><div style="font-size: 14px; color: #5c5c5c; line-height: 1.45; max-width: 470px;">Retro-Go is custom firmware that plays games from other consoles on this device.</div><div style="height: 26px;"></div><div style="display: grid; grid-template-columns: 30px minmax(0, 1fr); column-gap: 18px;"><div style="display: flex; flex-direction: column; align-items: center;"><span style="width: 24px; height: 24px; border-radius: 50%; border: 1px solid #d8d8d8; background: #ffffff; flex-shrink: 0;"></span><span style="width: 1px; flex-grow: 1; background: #d8d8d8; margin: 8px 0;"></span></div><div style="display: flex; flex-direction: column; gap: 10px; padding-bottom: 26px;"><div style="height: 48px; display: flex; align-items: center;"><span style="display: flex; align-items: center; justify-content: flex-start; gap: 10px;"><img src="logo-gnw-badge.svg" alt="Game &amp; Watch" style="height: 48px; width: auto; display: block; flex-shrink: 0;"><svg width="22" height="22" viewBox="0 0 11 11" fill="none" style="flex-shrink: 0;" aria-hidden="true"><path d="M5.5 0.5 V10.5 M0.5 5.5 H10.5" stroke="#c8c8c8" stroke-width="1.7"/></svg><img src="logo-rgo.png" alt="Retro-Go" style="height: 22px; width: auto; display: block; flex-shrink: 0;"></span></div><span style="font-size: 16px; font-weight: 600; letter-spacing: -0.015em; color: #1b1b1b;">Dual Boot</span></div></div><div style="display: grid; grid-template-columns: 30px minmax(0, 1fr); column-gap: 18px;"><div style="display: flex; flex-direction: column; align-items: center;"><span style="width: 24px; height: 24px; border-radius: 50%; border: 1px solid #d8d8d8; background: #ffffff; flex-shrink: 0;"></span><span style="width: 1px; flex-grow: 1; background: #d8d8d8; margin: 8px 0;"></span></div><div style="display: flex; flex-direction: column; gap: 10px; padding-bottom: 26px;"><div style="height: 48px; display: flex; align-items: center;"><span style="display: flex; align-items: center; justify-content: flex-start; gap: 10px;"><img src="logo-rgo.png" alt="Retro-Go" style="height: 22px; width: auto; display: block; flex-shrink: 0;"></span></div><span style="font-size: 16px; font-weight: 600; letter-spacing: -0.015em; color: #1b1b1b;">Only Retro-Go</span></div></div><div style="display: grid; grid-template-columns: 30px minmax(0, 1fr); column-gap: 18px;"><div style="display: flex; flex-direction: column; align-items: center;"><span style="width: 24px; height: 24px; border-radius: 50%; border: 1px solid #d8d8d8; background: #ffffff; flex-shrink: 0;"></span></div><div style="display: flex; flex-direction: column; gap: 10px; padding-bottom: 0;"><div style="height: 48px; display: flex; align-items: center;"><span style="display: flex; align-items: center; justify-content: flex-start; gap: 10px;"><img src="logo-gnw-badge.svg" alt="Game &amp; Watch" style="height: 48px; width: auto; display: block; flex-shrink: 0;"></span></div><span style="font-size: 16px; font-weight: 600; letter-spacing: -0.015em; color: #1b1b1b;">Return to Stock</span></div></div><div style="height: 22px;"></div><span style="font-size: 13px; color: #9a9a9a;">Something else? <span style="font-weight: 600; color: #6e6e6e;">Use the Advanced tab</span></span></div></div>
</div>
</x-dc>

</html>
