<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap">
  <style>
    body { margin: 0; }
  </style>
</helmet>

<!--
The chooser as most people meet it: a patched device with room for anything.
Three names, three marks, nothing under them. The card is the answer to the title;
a consequence that has to be stated does not belong in a button caption.
-->

<div style="width: 1440px; min-height: 900px; background: #f4f4f4; color: #1b1b1b; font-family: 'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif; font-size: 16px; line-height: 1.5; display: flex; flex-direction: column;">

  <div style="display: flex; flex-direction: column;">
    <div style="height: 56px; background: #ffffff; display: flex; align-items: center; justify-content: space-between; padding: 0 40px;">
      <div style="display: flex; align-items: center; gap: 13px;">
        <svg width="19" height="19" viewBox="0 0 20 20" fill="none" stroke="#1b1b1b" stroke-width="1.3" stroke-linecap="round">
          <rect x="5" y="5" width="10" height="10" rx="1.2"></rect>
          <path d="M7.5 5V3M10 5V3M12.5 5V3M7.5 17v-2M10 17v-2M12.5 17v-2M5 7.5H3M5 10H3M5 12.5H3M17 7.5h-2M17 10h-2M17 12.5h-2"></path>
        </svg>
        <div style="display: flex; align-items: center; gap: 11px;">
          <span style="position: relative; display: inline-flex; flex-shrink: 0;">
            <span style="height: 28px; width: 47px; background: #2e9e44; border: 1px solid rgba(0,0,0,0.35); border-radius: 2px; box-shadow: 0 1px 0 rgba(255,255,255,0.5) inset, 0 1px 2px rgba(0,0,0,0.25); display: flex; align-items: center; justify-content: center;">
              <img src="icon-console.svg" alt="" style="height: 100%; width: 100%; object-fit: contain; display: block;">
            </span>
          </span>
          <span style="font-size: 14px; font-weight: 600;">Connected</span>
        </div>
        <span style="width: 1px; height: 18px; background: #d8d8d8; margin: 0 3px;"></span>
        <div style="display: flex; align-items: center; gap: 8px;">
          <img src="logo-gnw-badge.svg" alt="Game &amp; Watch" style="height: 27px; width: auto; display: block; flex-shrink: 0;">
          <span style="font-size: 14px; font-weight: 600;">Zelda (Patched)</span>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 18px;">
        <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="#5c5c5c" stroke-width="1.5" stroke-linecap="round"><path d="M4 5.5h12M4 10h12M4 14.5h7"></path></svg>
        <span style="font-size: 12px; font-weight: 500; color: #5c5c5c;">EN</span>
      </div>
    </div>
    <div style="height: 3px; background: linear-gradient(180deg, #d9bc5e 0%, #c09a32 100%);"></div>
  </div>

  <div style="padding: 0 40px; background: #ffffff; border-bottom: 1px solid #d8d8d8; display: flex; align-items: stretch; gap: 34px;">
    <div style="display: flex; align-items: center; height: 46px; padding: 0 2px; font-size: 14px; font-weight: 600; letter-spacing: 0.02em; color: #6e6e6e;">Overview</div><div style="display: flex; align-items: center; height: 46px; padding: 0 2px; font-size: 14px; font-weight: 700; letter-spacing: 0.02em; color: #1b1b1b; box-shadow: inset 0 -3px 0 #3e9e4e;">Firmware</div><div style="display: flex; align-items: center; height: 46px; padding: 0 2px; font-size: 14px; font-weight: 600; letter-spacing: 0.02em; color: #6e6e6e;">Sources</div><div style="display: flex; align-items: center; height: 46px; padding: 0 2px; font-size: 14px; font-weight: 600; letter-spacing: 0.02em; color: #6e6e6e;">Library</div>
  </div>

  <div style="padding: 0 40px; background: #ffffff; border-bottom: 1px solid #d8d8d8; display: flex; align-items: stretch; gap: 26px;">
    <div style="display: flex; align-items: center; height: 40px; font-size: 13px; font-weight: 600; color: #1b1b1b; box-shadow: inset 0 -2px 0 #3e9e4e;">Guided</div>
    <div style="display: flex; align-items: center; height: 40px; font-size: 13px; font-weight: 500; color: #6e6e6e;">Advanced</div>
  </div>

  <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; padding: 56px 40px;">
    <div style="display: flex; flex-direction: column">
      <div style="display: flex; align-items: center; gap: 6px; margin-bottom: 12px;"><span style="width: 22px; height: 6px; border-radius: 3px; background: #3e9e4e;"></span><span style="width: 6px; height: 6px; border-radius: 3px; background: #ededed;"></span></div>
      <h2 style="margin: 0 0 24px; font-size: 28px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.15; color: #1b1b1b;">What should this device run?</h2>
      
      <div style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; width: 304px">
        <div style="width: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 18px 20px; background: #ffffff; border: 1px solid #ededed; border-radius: 6px;">
          <span style="display: flex; align-items: center; justify-content: center; gap: 10px;"><img src="logo-gnw-badge.svg" alt="" style="height: 48px; width: auto; display: block;"><svg width="22" height="22" viewBox="0 0 11 11" style="display: block; flex: 0 0 auto;"><path d="M5.5 0.5 V10.5 M0.5 5.5 H10.5" stroke="#b4b4b4" stroke-width="1.7" fill="none"></path></svg><img src="logo-rgo.png" alt="" style="height: 22px; width: auto; display: block;"></span>
          <span style="width: 100%; text-align: center; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; color: #1b1b1b;">Dual Boot</span>
        </div>
        <div style="width: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 18px 20px; background: #ffffff; border: 1px solid #ededed; border-radius: 6px;">
          <span style="display: flex; align-items: center; justify-content: center; gap: 10px;"><img src="logo-rgo.png" alt="" style="height: 22px; width: auto; display: block;"></span>
          <span style="width: 100%; text-align: center; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; color: #1b1b1b;">Only Retro-Go</span>
        </div>
        <div style="width: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 18px 20px; background: #ffffff; border: 1px solid #ededed; border-radius: 6px;">
          <span style="display: flex; align-items: center; justify-content: center; gap: 10px;"><img src="logo-gnw-badge.svg" alt="" style="height: 48px; width: auto; display: block;"></span>
          <span style="width: 100%; text-align: center; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; color: #1b1b1b;">Return to Stock</span>
        </div>
      </div>
      <p style="margin: 0; font-size: 13px; color: #8a8a8a;">Something else? <span style="color: #6e6e6e; font-weight: 600;">Use the Advanced tab</span></p>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
