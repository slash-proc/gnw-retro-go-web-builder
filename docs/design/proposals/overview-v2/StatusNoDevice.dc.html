<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap">
  <style>
    body { margin: 0; }
    a { color: #3e9e4e; } a:hover { color: #2f7a3c; }
  </style>
</helmet>

<!--
  OVERVIEW / STATUS - nothing connected.

  The rows still exist, because their absence is the point: this is what the page will tell you
  once a probe is attached. Unknown is drawn as an em-dash-free blank with a grey marker, never
  as a failure - nothing is wrong, nothing has been read.

  Activity stays live in the rail. It is this session's record and does not need the console;
  everything else on this page does. That asymmetry is why this board exists.

  Reuses overview.waitingForConnection verbatim.
-->

<div style="width: 1440px; min-height: 760px; background: #f4f4f4; color: #1b1b1b; font-family: 'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif; font-size: 16px; line-height: 1.5; display: flex; flex-direction: column; position: relative;">

  <div style="display: flex; flex-direction: column;">
    <div style="height: 56px; background: #ffffff; display: flex; align-items: center; justify-content: space-between; padding: 0 40px;">
      <div style="display: flex; align-items: center; gap: 13px;">
        <svg width="19" height="19" viewBox="0 0 20 20" fill="none" stroke="#1b1b1b" stroke-width="1.3" stroke-linecap="round">
          <rect x="5" y="5" width="10" height="10" rx="1.2"></rect>
          <path d="M7.5 5V3M10 5V3M12.5 5V3M7.5 17v-2M10 17v-2M12.5 17v-2M5 7.5H3M5 10H3M5 12.5H3M17 7.5h-2M17 10h-2M17 12.5h-2"></path>
        </svg>
        <span style="font-size: 14px; font-weight: 600; color: #5c5c5c;">Not connected</span>
      </div>
      <div style="display: flex; align-items: center; gap: 18px;">
        <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="#5c5c5c" stroke-width="1.5" stroke-linecap="round"><path d="M4 5.5h12M4 10h12M4 14.5h7"></path></svg>
        <span style="font-size: 12px; font-weight: 500; color: #5c5c5c;">EN</span>
        <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="#5c5c5c" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 12.5A7 7 0 0 1 7.5 4a7 7 0 1 0 8.5 8.5z"></path>
        </svg>
      </div>
    </div>
    <div style="height: 3px; background: linear-gradient(180deg, #d9bc5e 0%, #c09a32 100%);"></div>
  </div>

  <div style="padding: 0 40px; background: #ffffff; border-bottom: 1px solid #d8d8d8; display: flex; align-items: stretch; gap: 34px;">
    <div style="display: flex; align-items: center; height: 46px; padding: 0 2px; font-size: 14px; font-weight: 700; letter-spacing: 0.02em; color: #1b1b1b; box-shadow: inset 0 -3px 0 #3e9e4e;">Overview</div>
    <div style="display: flex; align-items: center; height: 46px; padding: 0 2px; font-size: 14px; font-weight: 600; letter-spacing: 0.02em; color: #6e6e6e;">Firmware</div>
    <div style="display: flex; align-items: center; height: 46px; padding: 0 2px; font-size: 14px; font-weight: 600; letter-spacing: 0.02em; color: #6e6e6e;">Sources</div>
    <div style="display: flex; align-items: center; height: 46px; padding: 0 2px; font-size: 14px; font-weight: 600; letter-spacing: 0.02em; color: #6e6e6e;">Library</div>
  </div>

  <div style="display: grid; grid-template-columns: 244px minmax(0, 1fr); flex-grow: 1;">

    <div style="border-right: 1px solid #d8d8d8; padding: 32px 20px 40px 40px; display: flex; flex-direction: column; gap: 26px;">
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <div style="font-size: 11px; font-weight: 700; letter-spacing: 0.11em; color: #5c5c5c; text-transform: uppercase; padding-bottom: 6px;">Console</div>
        <div style="font-size: 14px; font-weight: 600; padding: 7px 0 7px 14px; margin-left: -14px; box-shadow: inset 2px 0 0 #3e9e4e; display: flex; align-items: center; justify-content: space-between; gap: 10px;"><span>Status</span></div>
        <div style="font-size: 14px; padding: 7px 0; display: flex; align-items: center; justify-content: space-between; gap: 10px;"><span style="color: #1b1b1b;">Details</span></div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <div style="font-size: 11px; font-weight: 700; letter-spacing: 0.11em; color: #5c5c5c; text-transform: uppercase; padding-bottom: 6px;">Logs</div>
        <div style="font-size: 14px; padding: 7px 0; display: flex; align-items: center; justify-content: space-between; gap: 10px;"><span style="color: #1b1b1b;">Activity</span></div>
        <div style="font-size: 14px; padding: 7px 0; display: flex; align-items: center; justify-content: space-between; gap: 10px;"><span style="color: #1b1b1b;">Device log</span></div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; justify-content: space-between;">
      <div style="padding: 32px 40px 40px; display: flex; flex-direction: column; gap: 30px; max-width: 720px;">
        <div style="font-size: 24px; font-weight: 600; letter-spacing: -0.015em;">Status</div>

        <div style="font-size: 14px; color: #5c5c5c;">Waiting for a device connection…</div>

        <div style="background: #ffffff; border: 1px solid #d8d8d8; border-radius: 6px; padding: 2px 18px;">
              <div style="display: flex; align-items: center; gap: 14px; padding: 13px 0; border-bottom: 1px solid #ededed;">
                <span style="width: 7px; height: 7px; border-radius: 999px; background: #d0d0d0; flex-shrink: 0;"></span>
                <span style="font-size: 14px; flex-grow: 1; min-width: 0; color: #5c5c5c;">Layout</span>
              </div>
              <div style="display: flex; align-items: center; gap: 14px; padding: 13px 0; border-bottom: 1px solid #ededed;">
                <span style="width: 7px; height: 7px; border-radius: 999px; background: #d0d0d0; flex-shrink: 0;"></span>
                <span style="font-size: 14px; flex-grow: 1; min-width: 0; color: #5c5c5c;">Debug probe</span>
              </div>
              <div style="display: flex; align-items: center; gap: 14px; padding: 13px 0; border-bottom: 1px solid #ededed;">
                <span style="width: 7px; height: 7px; border-radius: 999px; background: #d0d0d0; flex-shrink: 0;"></span>
                <span style="font-size: 14px; flex-grow: 1; min-width: 0; color: #5c5c5c;">Read protection</span>
              </div>
              <div style="display: flex; align-items: center; gap: 14px; padding: 13px 0; border-bottom: 1px solid #ededed;">
                <span style="width: 7px; height: 7px; border-radius: 999px; background: #d0d0d0; flex-shrink: 0;"></span>
                <span style="font-size: 14px; flex-grow: 1; min-width: 0; color: #5c5c5c;">Firmware backup</span>
              </div>
              <div style="display: flex; align-items: center; gap: 14px; padding: 13px 0; border-bottom: 1px solid #ededed;">
                <span style="width: 7px; height: 7px; border-radius: 999px; background: #d0d0d0; flex-shrink: 0;"></span>
                <span style="font-size: 14px; flex-grow: 1; min-width: 0; color: #5c5c5c;">Storage</span>
              </div>
              <div style="display: flex; align-items: center; gap: 14px; padding: 13px 0;">
                <span style="width: 7px; height: 7px; border-radius: 999px; background: #d0d0d0; flex-shrink: 0;"></span>
                <span style="font-size: 14px; flex-grow: 1; min-width: 0; color: #5c5c5c;">Installed firmware</span>
              </div></div>
      </div>

      <div style="border-top: 1px solid #d8d8d8; background: #ffffff; padding: 0 40px; min-height: 72px; box-sizing: border-box; margin-top: auto; display: flex; align-items: center; justify-content: space-between;">
        <span style="font-size: 13px; color: #5c5c5c;"></span>
        <div style="display: flex; align-items: center; gap: 12px;"><div style="font-size: 13px; font-weight: 600; color: #ffffff; background: #3e9e4e; border: 1px solid #35873f; border-radius: 5px; padding: 8px 18px;">Connect</div></div>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
