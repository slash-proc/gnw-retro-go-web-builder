<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap">
  <style>
    body { margin: 0; }
    a { color: #3e9e4e; } a:hover { color: #2f7a3c; }
  </style>
</helmet>

<div style="width: 1440px; min-height: 920px; background: #f4f4f4; color: #1b1b1b; font-family: 'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif; font-size: 16px; line-height: 1.5; display: flex; flex-direction: column;">

  <!-- Nothing is connected yet, so the header carries no device slots - only the lip and the two global controls. -->
  <div style="display: flex; flex-direction: column;">
    <div style="height: 56px; background: #ffffff; display: flex; align-items: center; justify-content: flex-end; padding: 0 40px; gap: 18px;">
      <span style="font-size: 12px; font-weight: 500; color: #5c5c5c;">EN</span>
      <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="#5c5c5c" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M16 12.5A7 7 0 0 1 7.5 4a7 7 0 1 0 8.5 8.5z"></path>
      </svg>
    </div>
    <div style="height: 3px; background: linear-gradient(180deg, #d9bc5e 0%, #c09a32 100%);"></div>
  </div>
  <div style="flex: 1; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 32px; padding: 0 40px; align-content: center;">
    <div style="grid-column: 4 / span 6; display: flex; flex-direction: column; gap: 28px;">
      <div style="display: flex; flex-direction: column; gap: 12px;"><div style="display: flex; align-items: center; gap: 6px;"><span style="width: 6px; height: 6px; border-radius: 3px; background: #d8d8d8;"></span><span style="width: 22px; height: 6px; border-radius: 3px; background: #3e9e4e;"></span></div><div style="font-size: 34px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.15;">What would you like to do?</div><div style="font-size: 15px; color: #5c5c5c;">You can switch at any time once you are in.</div></div>
      
      <div style="display: flex; gap: 18px;"><div style="flex: 1; background: #ffffff; border: 1px solid #d8d8d8; border-radius: 6px; padding: 24px 26px; display: flex; flex-direction: column; gap: 14px;"><svg width="26" height="26" viewBox="0 0 20 20" fill="none" stroke="#3e9e4e" stroke-width="1.2" stroke-linecap="round">
            <rect x="5" y="5" width="10" height="10" rx="1.2"></rect>
            <path d="M7.5 5V3M10 5V3M12.5 5V3M7.5 17v-2M10 17v-2M12.5 17v-2M5 7.5H3M5 10H3M5 12.5H3M17 7.5h-2M17 10h-2M17 12.5h-2"></path>
          </svg><div style="display: flex; flex-direction: column; gap: 4px;"><span style="font-size: 18px; font-weight: 600; letter-spacing: -0.01em;">Manage Device</span><span style="font-size: 14px; color: #5c5c5c;">Backup, patch, install firmware. Requires an adapter.</span></div></div><div style="flex: 1; background: #ffffff; border: 1px solid #d8d8d8; border-radius: 6px; padding: 24px 26px; display: flex; flex-direction: column; gap: 14px;"><svg width="26" height="26" viewBox="0 0 20 20" fill="none" stroke="#1b1b1b" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2.5" y="4.5" width="15" height="11" rx="1.6"></rect><path d="M6 8v4M4 10h4"></path><circle cx="13.5" cy="9.5" r="1"></circle><circle cx="15.5" cy="11.5" r="1"></circle>
          </svg><div style="display: flex; flex-direction: column; gap: 4px;"><span style="font-size: 18px; font-weight: 600; letter-spacing: -0.01em;">Manage Library</span><span style="font-size: 14px; color: #5c5c5c;">Build and install your ROM collection.</span></div></div></div>
      <span style="font-size: 13px; font-weight: 500; color: #5c5c5c;">Manage Device (advanced) →</span>
      <div style="display: flex; align-items: center; justify-content: space-between; padding-top: 4px;"><span style="font-size: 14px; font-weight: 500; color: #5c5c5c;">← Back</span></div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
